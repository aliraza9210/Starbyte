<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b18" />
      <stop offset="50%" stop-color="#0c1126" />
      <stop offset="100%" stop-color="#04060f" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C4CC" />
      <stop offset="70%" stop-color="#7D2AE8" />
      <stop offset="100%" stop-color="#FF5C35" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#00C4CC" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#7D2AE8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#bgGrad)" />
  <rect width="600" height="380" fill="url(#cyberGrid)" />
  <circle cx="300" cy="180" r="220" fill="url(#ambientGlow)" />

  <!-- Glass Card Base -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="480" height="300" rx="24" fill="rgba(13, 18, 37, 0.65)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
    <rect x="1" y="1" width="478" height="30" rx="24" fill="rgba(255, 255, 255, 0.02)" />

    <!-- Brand Emblem Stage -->
    <g transform="translate(20, 30)">
      <circle cx="120" cy="120" r="85" fill="none" stroke="#00C4CC" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8,6" />
      <circle cx="120" cy="120" r="72" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
      <text x="120" y="145" font-family="Space Grotesk, sans-serif" font-weight="900" font-size="76" fill="url(#brandGrad)" text-anchor="middle" filter="url(#glow)">Canva</text>
    </g>

    <!-- Product Text Hierarchy -->
    <g transform="translate(260, 65)">
      <!-- Eyebrow Tag -->
      <rect x="0" y="0" width="180" height="26" rx="13" fill="#00C4CC18" stroke="#00C4CC40" stroke-width="1" />
      <text x="90" y="17" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#00C4CC" text-anchor="middle" letter-spacing="1.5">CANVA</text>

      <!-- Main Title -->
      <text x="0" y="60" font-family="Space Grotesk, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">CANVA PRO</text>

      <!-- Subtitle Tagline -->
      <text x="0" y="90" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.6)" letter-spacing="1">FAMILY EDITION • 1 YEAR</text>

      <!-- STAR BYTE Verified Badge -->
      <g transform="translate(0, 125)">
        <rect x="0" y="0" width="165" height="32" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#10B981" />
        <text x="32" y="20" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#34D399" letter-spacing="0.5">INSTANT DELIVERY</text>
      </g>
    </g>

    <!-- Bottom Accent Line -->
    <rect x="40" y="270" width="400" height="2" fill="url(#brandGrad)" opacity="0.6" rx="1" />
  </g>
</svg>